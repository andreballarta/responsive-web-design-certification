<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="container">
    <h1>My To-Do List of Certifications</h1>
    <ul class="todo-list">
        <li>
            <input id="python" type="checkbox">
            <label for="python">Python</label>
            <ul class="sub-item">
                <li>
                    <a class= sub-item-link href="https://www.freecodecamp.org/learn/python-v9"  target="_blank">Python Certification from freeCodeCamp.</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="javascript" type="checkbox">
            <label for="javascript">JavaScript</label>
            <ul class="sub-item">
                <li>
                    <a class= sub-item-link href="https://www.freecodecamp.org/learn/javascript-v9" target="_blank">JavaScript Certification from freeCodeCamp.</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="rel-db" type="checkbox">
            <label for="rel-db">Relational Databases</label>
            <ul class="sub-item">
                <li>
                    <a class= sub-item-link href="https://www.freecodecamp.org/learn/python-v9"  target="_blank">Relational Databases Certification from freeCodeCamp.</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="front-end" type="checkbox">
            <label for="front-end">Front-End</label>
            <ul class="sub-item">
                <li>
                    <a class= sub-item-link href="https://www.freecodecamp.org/learn/python-v9"  target="_blank">Front-End Development Libraries Certification from freeCodeCamp.</a>
                </li>
            </ul>
        </li>
    </ul>
    </div>
</body>

</html>
